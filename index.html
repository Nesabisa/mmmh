<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F2F2F7;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.2);
  --ink:#000000;--muted:rgba(60,60,67,.6);--line:rgba(60,60,67,.18);
  --accent:#FF7A1A;--accent-soft:rgba(255,122,26,.14);--pink:#FF375F;
  --basil:#34C759;--basil-soft:rgba(52,199,89,.15);--saffron:#FF9F0A;--saffron-soft:rgba(255,159,10,.16);--plum:#AF52DE;--plum-soft:rgba(175,82,222,.14);--blue:#0A84FF;--blue-soft:rgba(10,132,255,.13);
  --warn:#FF3B30;--sunset:linear-gradient(150deg,#FFA62B 0%,#FF6A3D 45%,#FF375F 100%);
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --bar:rgba(249,249,249,.82);
  color-scheme:dark;
}
/* immer dunkel */
:root{
  --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.32);
  --ink:#FFFFFF;--muted:rgba(235,235,245,.6);--line:rgba(84,84,88,.6);
  --accent:#FF8A2B;--accent-soft:rgba(255,138,43,.2);
  --basil:#30D158;--basil-soft:rgba(48,209,88,.2);--saffron:#FFB340;--saffron-soft:rgba(255,179,64,.2);--plum:#BF5AF2;--plum-soft:rgba(191,90,242,.22);--blue:#409CFF;--blue-soft:rgba(64,156,255,.2);
  --warn:#FF453A;--bar:rgba(22,22,24,.82);}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(110px + env(safe-area-inset-bottom,0px))}
/* large title */
.mast{display:flex;flex-direction:column;gap:2px;padding:18px 4px 14px}
.mast h1{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.025em;margin:0}
.mast .aside{font-size:15px;color:var(--muted)}
.mast .aside b{color:var(--accent);font-weight:600;margin-right:5px}
h2{font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);margin:26px 16px 7px}
h3{font-size:17px;font-weight:600;margin:0}
p{margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:13px;line-height:1.4}.warn{color:var(--warn)}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 4px);z-index:20}
nav.tabs:empty{display:none}
nav.tabs button{flex:1;max-width:110px;background:none;border:0;padding:2px 0;font-size:10px;font-weight:500;color:#999;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;letter-spacing:0}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:-2px;left:calc(50% + 6px);min-width:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:#fff;font-size:12px;line-height:18px;font-weight:500}
/* segmented control */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 16px}
.seg button{flex:1;background:none;border:0;border-radius:7px;padding:6px 4px;font-weight:600;font-size:13px;line-height:1.25}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.08)}
.seg button[aria-pressed="true"]{background:#636366}
.seg small{display:block;font-weight:400;color:var(--muted);font-size:11px}
/* buttons */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;font-size:16px;background:var(--accent-soft);color:var(--accent);line-height:1.2}
.btn.basil{background:var(--accent);color:#fff;padding:15px 16px;font-size:17px;border-radius:14px}
.btn.ghost{background:var(--card);color:var(--accent)}
.btn.sm{padding:8px 14px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:400;font-size:15px;text-decoration:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{border:0;background:var(--card);border-radius:999px;padding:7px 14px;font-weight:500;font-size:15px;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--accent);color:#fff}
.pill.x{background:var(--accent-soft);color:var(--accent)}
.pill.x::after{content:"  ✕";font-size:12px}
input[type=search],input[type=text],input[type=number],select,textarea{border:0;background:var(--card);border-radius:10px;padding:10px 12px;width:100%;font-size:17px;-webkit-appearance:none;appearance:none}
input[type=search]{background:var(--fill)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea{min-height:140px;resize:vertical}
input[type=number]{width:88px}
.stepper{display:inline-flex;align-items:center;background:var(--fill);border-radius:9px}
.stepper button{background:none;border:0;width:44px;height:32px;font-size:22px;font-weight:300;line-height:1}
.stepper span{min-width:30px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;border-left:.5px solid var(--line);border-right:.5px solid var(--line);line-height:20px}
/* grouped lists */
.ledger,.group{background:var(--card);border-radius:12px;overflow:hidden}
.lrow{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:11px 16px 11px 12px;width:100%;background:none;border:0;text-align:left;position:relative}
.lrow+.lrow::before,.item+.item::before,.day+.day::before{content:"";position:absolute;top:0;right:0;left:72px;border-top:.5px solid var(--line)}
.item+.item::before{left:52px}
.lrow .min{width:44px;height:44px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;line-height:1}
.lrow .min small{font-size:9px;font-weight:500;margin-top:2px;opacity:.85}
.lrow .t{font-weight:600;font-size:16px;line-height:1.25}
.lrow .s{font-size:13px;color:var(--muted);margin-top:3px}
.lrow .k{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.lrow .k b{font-size:17px;color:var(--ink);font-weight:600}
.mbar{display:flex;gap:2px;height:4px;border-radius:2px;overflow:hidden;margin-top:7px;max-width:200px}
.mbar i{display:block;height:100%;border-radius:2px}
.ip{background:var(--basil)}.ic{background:var(--saffron)}.if{background:var(--plum)}
.diet{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;margin-right:5px;vertical-align:1px}
.d-vegan{background:var(--basil-soft);color:var(--basil)}.d-veg{background:var(--basil-soft);color:var(--basil)}.d-meat{background:var(--saffron-soft);color:var(--saffron)}.d-fish{background:var(--blue-soft);color:var(--blue)}
.own{background:var(--plum-soft);color:var(--plum)}
/* vote card */
.vote{background:var(--sunset);color:#fff;border-radius:24px;padding:22px 20px 18px;position:relative;box-shadow:0 12px 30px -10px rgba(255,80,60,.5)}
.vote .diet{background:rgba(255,255,255,.24);color:#fff}
.vote .name{font-weight:700;font-size:30px;line-height:1.08;letter-spacing:-.025em;margin:12px 0 16px}
.vote .facts{display:flex;gap:26px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.vote .facts b{font-size:24px;font-weight:700;display:block;line-height:1.1}
.vote .facts span{font-size:13px;opacity:.82}
.vote .mbar{background:rgba(255,255,255,.2)}
.vote .ip{background:#fff}.vote .ic{background:rgba(255,255,255,.62)}.vote .if{background:rgba(255,255,255,.34)}
.vote .muted,.vote .warn{color:rgba(255,255,255,.88)}
.vote .link{color:#fff;font-weight:600}
.vbtns{display:flex;justify-content:space-around;margin-top:20px}
.vbtns button{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600}
.vbtns .ic2{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .12s}
.vbtns button:active .ic2{transform:scale(.9)}
.vbtns .ic2 svg{width:28px;height:28px}
.vbtns .love .ic2{background:#fff;color:var(--pink);width:72px;height:72px;margin-top:-4px}
.who{display:inline-flex;gap:4px;font-size:12px;flex-wrap:wrap}
.who span{padding:1px 8px;border-radius:999px;background:var(--fill)}
.who .s3{background:var(--accent);color:#fff}.who .s2{background:var(--accent-soft);color:var(--accent)}.who .s0{background:transparent;box-shadow:inset 0 0 0 1px var(--warn);color:var(--warn)}
/* days */
.day{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 16px 12px 14px;position:relative}
.day .dn{font-weight:700;font-size:17px;color:var(--accent);line-height:1.1}
.day .dn small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.day.skip .t{text-decoration:line-through;color:var(--muted)}
.day.skip .dn{color:var(--muted)}
.day .acts{display:flex;gap:16px;margin-top:4px;flex-wrap:wrap}
/* list items */
.item{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative;background:var(--card)}
.group .item{background:none}
:not(.group)>.item{border-radius:12px;margin-bottom:8px}
.item input[type=checkbox]{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #C7C7CC;margin:0;flex:none;display:grid;place-content:center;background:none}
.item input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.item input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.item .body{flex:1;min-width:0}
.item .nm b{font-weight:400}
.item .amt{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;font-size:15px}
.item.done .nm{color:var(--muted)}
.by{font-size:12px;color:var(--accent)}
details{margin-top:0}
summary{font-size:13px;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:8px 16px;list-style:none}
summary::after{content:"  ›";display:inline-block;transition:transform .2s}
details[open] summary::after{transform:rotate(90deg)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94%;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:14px 14px 0 0;padding:8px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.sheet::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto 10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .32s cubic-bezier(.2,.9,.3,1)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px}
.sheet-head h2{margin:6px 0 0;font-size:26px;font-weight:700;text-transform:none;color:var(--ink);letter-spacing:-.02em;line-height:1.12}
.x-btn{background:var(--fill);border:0;border-radius:50%;width:30px;height:30px;flex:none;font-size:15px;line-height:1;color:var(--muted);font-weight:600}
.fgroup{padding:12px 0}
.fgroup h3{margin-bottom:8px;font-size:13px;font-weight:400;text-transform:uppercase;color:var(--muted)}
.facts4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.facts4 div{padding:12px 6px;text-align:center;background:var(--card);border-radius:12px}
.facts4 b{display:block;font-weight:700;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.facts4 div:nth-child(2) b{color:var(--basil)}.facts4 div:nth-child(3) b{color:var(--saffron)}.facts4 div:nth-child(4) b{color:var(--plum)}
.facts4 small{font-size:11px;color:var(--muted)}
.ing li{padding:10px 0;border-bottom:.5px solid var(--line);list-style:none}
.ing li:last-child{border-bottom:0}
.ing{padding:0;margin:0}
.ing .l{display:flex;justify-content:space-between;gap:10px}
.ing .l b{font-weight:500;color:var(--muted)}
.subs{font-size:14px;color:var(--muted);margin-top:4px}
ol.steps{padding-left:22px;margin:0}ol.steps li{margin-bottom:10px;line-height:1.45}
.panel{border-radius:12px;padding:14px 16px;margin:12px 0;background:var(--card)}
.panel input[type=text],.panel input[type=number],.panel select,.panel textarea{background:var(--card2)}
.formg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formg label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.formg input,.formg select{width:100%}
.nrow{padding:10px 0;border-bottom:.5px solid var(--line)}
.nrow .top{display:grid;grid-template-columns:1fr 84px auto;gap:6px;align-items:center}
.nrow .top input{width:100%}
.nrow .other{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.nrow .nut4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;grid-column:1/-1}
.nrow .nut4 input{width:100%;padding:8px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--ink);padding:11px 20px;border-radius:999px;font-weight:600;font-size:15px;z-index:50;max-width:90%;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.empty{padding:28px 20px;text-align:center;color:var(--muted);background:var(--card);border-radius:12px}
.ring{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:4px 4px 6px}
.kbig{font-weight:700;font-size:56px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;background:var(--sunset);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{height:4px;border-radius:2px;background:var(--fill);margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;border-radius:2px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;background:var(--card);border-radius:12px;padding:6px}
.datebar button{background:none;border:0;border-radius:8px;width:40px;height:34px;font-size:22px;color:var(--accent)}
.datebar button:disabled{color:var(--fill2)}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--muted)}
.sync.on{background:var(--basil)}.sync.err{background:var(--warn)}
.heart{color:var(--pink)}
h2+p{margin-left:16px;margin-right:16px}
@media (hover:hover){.lrow:hover,.btn:hover{filter:brightness(.97)}}
@media (max-width:520px){.facts4 b{font-size:19px}}
</style>
</head>

<script>
// ================= basics =================
const MEALS={F:'Frühstück',M:'Mittag',A:'Abendessen'};
const SLOTS=['Frühstück','Mittag','Abendessen','Snack'];
const CATS={meat:'Fleisch',fish:'Fisch & Meeresfrüchte',dairy:'Milchprodukte',egg:'Eier',gluten:'Gluten',nuts:'Nüsse & Erdnüsse',soy:'Soja',sesam:'Sesam'};
const DIETS={meat:'Fleisch',fish:'Fisch',veg:'Vegetarisch',vegan:'Vegan'};
const FLAGS={o:'Ofen',p:'Ein Topf / eine Pfanne',m:'Meal-Prep',k:'Ohne Kochen'};
const BASE=4;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r0=n=>Math.round(n);
const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseK=k=>{const [Y,M,D]=k.split('-');return new Date(+Y,+M-1,+D);};
const addDays=(k,n)=>{const d=parseK(k);d.setDate(d.getDate()+n);return dkey(d);};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o??null));
function mondayOf(d=new Date()){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return dkey(x);}
const THIS_WEEK=mondayOf(),NEXT_WEEK=addDays(THIS_WEEK,7);
const deadlineOf=w=>{const d=parseK(addDays(w,-3));d.setHours(23,59,59);return d;};
const fmtD=(k,o)=>parseK(k).toLocaleDateString('de-DE',o);
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
const slug=s=>String(s||'').toLowerCase().trim().replace(/\s+/g,'-').replace(/[^a-z0-9äöüß_-]/g,'').slice(0,40);

// ================= cloud (Firebase, gleiches Projekt wie Gym Tracker) =================
const FB_CFG={apiKey:"AIzaSyDBeS_N564vAqpdFEuTXtwmRq1NQxJyTGo",authDomain:"ausgaben-ac792.firebaseapp.com",projectId:"ausgaben-ac792",storageBucket:"ausgaben-ac792.firebasestorage.app",messagingSenderId:"1036481285970",appId:"1:1036481285970:web:c442d03361f44a9185348b"};
const FB_V='11.8.0';
// Kleine Hülle um Firestore: alle Daten eines Küchen-Codes liegen unter familienkueche/{code}/…
async function connectCloud(code){
  const A=await import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-app.js`);
  const F=await import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-firestore.js`);
  const fs=F.getFirestore(A.initializeApp(FB_CFG));
  const root=['familienkueche',code];
  const ref=p=>{const s=p.split('/');return s.length===2?F.doc(fs,...root,s[0],s[1]):F.doc(fs,...root,'misc',s.join('~'));};
  const snap=s=>({exists:s.exists(),id:s.id,data:()=>s.data()});
  const ok=()=>setSync('on'),bad=e=>{console.warn(e);setSync('err');};
  return{
    doc:p=>{const r=ref(p);return{
      get:async()=>snap(await F.getDoc(r)),
      set:d=>F.setDoc(r,d),
      update:d=>F.setDoc(r,d,{merge:true}),
      delete:()=>F.deleteDoc(r),
      onSnapshot:(cb,err)=>F.onSnapshot(r,s=>{ok();cb(snap(s));},e=>{bad(e);err&&err(e);})};},
    collection:n=>({onSnapshot:(cb,err)=>F.onSnapshot(F.collection(fs,...root,n),s=>{ok();cb({docs:s.docs.map(snap)});},e=>{bad(e);err&&err(e);})})
  };
}
let SYNC='off';
function setSync(s){if(SYNC===s)return;SYNC=s;if(ui.tab==='ich')render();}

// ================= recipes =================
let RECIPES=[],CUSTOM={};
function nutrOf(i,amt){const f=i.u==='Stk'?amt:amt/100;return{k:i.k*f,p:i.p*f,c:i.c*f,f:i.f*f};}
function buildRecipe(id,n,meals,min,ings,steps,flags,own){
  const tot={k:0,p:0,c:0,f:0},tags=new Set();
  ings.forEach(([iid,a])=>{const i=ING[iid];if(!i)return;const x=nutrOf(i,a);for(const k in tot)tot[k]+=x[k];i.tags.forEach(t=>tags.add(t));});
  const per={k:tot.k/BASE,p:tot.p/BASE,c:tot.c/BASE,f:tot.f/BASE};
  const diet=tags.has('meat')?'meat':tags.has('fish')?'fish':(tags.has('dairy')||tags.has('egg')||tags.has('nonvegan'))?'veg':'vegan';
  const kc=per.k||1;
  return{id,n,meals,min,ings,steps,flags:flags||'',per,tags,diet,own:!!own,
    hp:per.p>=25||per.p*4/kc>=0.3,lowfat:per.f<=12,lowcarb:per.c<=30,light:per.k<=500};
}
function rebuildRecipes(){
  RECIPES=REC_RAW.map(r=>buildRecipe(r[0],r[1],r[2].split(''),r[3],r[4],r[5],r[6],false));
  Object.entries(CUSTOM).forEach(([rid,c])=>{
    if(!c||!c.n||!Array.isArray(c.ings))return;
    const f=BASE/(c.serv||BASE);const ings=[];
    c.ings.forEach((x,i)=>{
      let id=x.id&&ING[x.id]&&!String(x.id).startsWith('x_')?x.id:null;
      if(!id){id='x_'+rid+'_'+i;const u=['g','ml','Stk'].includes(x.unit)?x.unit:'g';
        ING[id]={id,n:x.name||'Zutat',u,k:+x.k||0,p:+x.p||0,c:+x.c||0,f:+x.f||0,tags:Array.isArray(x.tags)?x.tags.filter(t=>CATS[t]||t==='nonvegan'):[],pack:u==='Stk'?1:(u==='ml'?500:250),pantry:false,subs:[],custom:true,nonut:!(+x.k)};}
      ings.push([id,(+x.amt||0)*f]);
    });
    RECIPES.push(buildRecipe(rid,c.n,(c.meals||['A']).filter(m=>MEALS[m]),+c.min||30,ings,c.steps||[],c.flags||'',true));
  });
}
const R=id=>RECIPES.find(r=>r.id===id);

// ================= state =================
const P_DEF={avoid:[],likes:[],goals:{k:'',p:'',c:'',f:''},favFoods:[],showSubs:true,hearts:[]};
let ME=clone(P_DEF);                 // private settings
let HH={dinners:7,serv:4,pause:2};   // household
let WEEKS={};                         // weekKey -> doc
let VOTES={};                         // voterId -> {w:{week:{rid:score}},veto:[]}
let LOGS={};
let myId='me',names={},mode='local';
let db=null;
let ui={tab:'woche',week:NEXT_WEEK,q:'',f:{meal:[],diet:[],nut:[],time:0,prep:[],fav:false,own:false,heart:false},date:dkey(),undo:null};
const tried={};

function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let SETUP=lsGet('fk-setup');          // {code,id,name}

// serialized writes per doc
const q={};
function write(path,fn){const prev=q[path]||Promise.resolve();q[path]=prev.then(fn).catch(e=>{console.warn(path,e);toast('Speichern fehlgeschlagen');});return q[path];}
function persistLocal(){lsSet('fk2',{ME,HH,WEEKS,VOTES,CUSTOM});}

// private settings
let meT=null;
function saveMe(){persistLocal();clearTimeout(meT);meT=setTimeout(()=>{if(db)write('me',()=>db.doc(`data/users/${myId}/p/settings`).set(clone(ME)));},600);syncVeto();}
// household
function saveHH(){persistLocal();if(db)write('hh',()=>db.doc('household/main').set(clone(HH)));}
// weeks
function emptyWeek(){return{finalized:false,days:{},bought:{},extras:{}};}
function weekDoc(w){if(!WEEKS[w])WEEKS[w]=emptyWeek();return WEEKS[w];}
async function patchWeek(w,patch){
  const W=weekDoc(w);deepMerge(W,patch);persistLocal();render();
  if(!db)return;
  const ref=db.doc('weeks/'+w);
  return write('w'+w,async()=>{const s=await ref.get();if(!s.exists){const base=emptyWeek();deepMerge(base,clone(patch));await ref.set(base);}else await ref.update(clone(patch));});
}
function deepMerge(t,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])){if(!t[k]||typeof t[k]!=='object')t[k]={};deepMerge(t[k],s[k]);}else t[k]=s[k];}return t;}
// votes
function myVotes(){if(!VOTES[myId])VOTES[myId]={w:{},veto:[]};return VOTES[myId];}
let vT=null;
function saveVotes(){persistLocal();clearTimeout(vT);vT=setTimeout(()=>{if(db)write('votes',()=>db.doc('votes/'+myId).set(clone(myVotes())));},400);}
function syncVeto(){const v=myVotes();const veto=RECIPES.filter(r=>{const a=recipeAvoid(r);return!a.ok&&!a.fixable;}).map(r=>r.id).sort();if(JSON.stringify(veto)!==JSON.stringify(v.veto||[])){v.veto=veto;saveVotes();}}
// logs (private)
async function loadLog(k){
  if(LOGS[k])return LOGS[k];LOGS[k]=lsGet('fk-log-'+k)||[];
  if(db){try{const s=await db.doc(`data/users/${myId}/p/log-${k}`).get();if(s.exists)LOGS[k]=clone(s.data().entries||[]);}catch(e){console.warn(e)}}
  return LOGS[k];}
function saveLog(k){lsSet('fk-log-'+k,LOGS[k]);if(db)write('log'+k,()=>db.doc(`data/users/${myId}/p/log-${k}`).set({entries:clone(LOGS[k])}));}

// ================= domain helpers =================
function isAvoidedIng(id){const i=ING[id];return ME.avoid.includes('ing:'+id)||i.tags.some(t=>ME.avoid.includes('cat:'+t));}
const subOk=s=>!s.t.some(t=>ME.avoid.includes('cat:'+t));
function recipeAvoid(r){const bad=r.ings.filter(([id])=>isAvoidedIng(id)).map(([id])=>id);if(!bad.length)return{ok:true,swaps:[]};const swaps=bad.map(id=>({id,sub:ING[id].subs.find(subOk)}));return{ok:false,swaps,fixable:swaps.every(s=>s.sub)};}
const hearted=id=>(ME.hearts||[]).includes(id);
function toggleHeart(id){ME.hearts=ME.hearts||[];const i=ME.hearts.indexOf(id);if(i>=0)ME.hearts.splice(i,1);else ME.hearts.push(id);saveMe();toast(i>=0?'Aus deinen Herz-Rezepten entfernt':'Als Herz-Rezept gespeichert');}
const likeScore=r=>r.ings.filter(([id])=>ME.likes.includes('ing:'+id)).length;
function fmtAmt(id,a){const u=ING[id].u;if(u==='Stk'){const v=Math.max(0.5,Math.round(a*2)/2);return v.toLocaleString('de-DE')+' Stk';}return r0(a)+' '+u;}
function toast(t){document.querySelectorAll('.toast').forEach(e=>e.remove());const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2400);}
function slotNow(){const h=new Date().getHours();return h<11?'Frühstück':h<15?'Mittag':h<18?'Snack':'Abendessen';}
const nameOf=id=>id===myId?'Du':(names[id]||'Partner:in');
function mbar(r){const p=r.per.p*4,c=r.per.c*4,f=r.per.f*9,t=p+c+f||1;return`<div class="mbar" aria-label="Protein ${r0(p/t*100)} %, Kohlenhydrate ${r0(c/t*100)} %, Fett ${r0(f/t*100)} % der Kalorien"><i class="ip" style="width:${p/t*100}%"></i><i class="ic" style="width:${c/t*100}%"></i><i class="if" style="width:${f/t*100}%"></i></div>`;}
const dietTag=r=>`<span class="diet d-${r.diet}">${DIETS[r.diet]}</span>${r.own?'<span class="diet own">Eigenes</span>':''}`;

// ================= voting =================
function recentRids(w){const s=new Set();for(let k=1;k<=(HH.pause||0);k++){const W=WEEKS[addDays(w,-7*k)];if(!W||!W.days)continue;Object.values(W.days).forEach(x=>{if(x&&x.rid&&!x.skip)s.add(x.rid);});}return s;}
const dinnerPool=(w=ui.week)=>{const rec=recentRids(w);return RECIPES.filter(r=>(r.meals.includes('A')||r.meals.includes('M'))&&!rec.has(r.id));};
function voters(){return Object.keys(VOTES).filter(id=>VOTES[id]&&(id===myId||Object.keys((VOTES[id].w||{})).length));}
function scoreFor(vid,w,rid){const v=VOTES[vid]||{};const s=v.w&&v.w[w]&&v.w[w][rid];if(s!=null)return s;if((v.veto||[]).includes(rid))return 0;return null;}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function ranking(w){
  const vs=voters();if(!vs.includes(myId))vs.push(myId);
  return dinnerPool(w).map(r=>{const sc=vs.map(v=>({v,s:scoreFor(v,w,r.id)}));const vals=sc.map(x=>x.s==null?1:x.s);
    return{r,sc,veto:vals.includes(0),sum:vals.reduce((a,b)=>a+b,0),min:Math.min(...vals),voted:sc.some(x=>x.s!=null&&x.s>0),match:sc.length>1&&sc.every(x=>x.s>=2)};})
   .filter(x=>!x.veto).sort((a,b)=>b.sum-a.sum||b.min-a.min||(hash(w+a.r.id)-hash(w+b.r.id)));
}
function weekDates(w){return Array.from({length:7},(_,i)=>addDays(w,i));}
function finalize(w){
  const rank=ranking(w),N=Math.max(1,Math.min(7,HH.dinners)),days={};
  weekDates(w).forEach((d,i)=>{days[d]={rid:i<N&&rank[i]?rank[i].r.id:null,serv:HH.serv,skip:i>=N};});
  patchWeek(w,{finalized:true,days});toast('Plan steht. Die Einkaufsliste ist fertig.');
}
function replaceDay(w,d){
  const W=weekDoc(w);const used=new Set(Object.values(W.days||{}).map(x=>x&&x.rid).filter(Boolean));
  tried[d]=tried[d]||new Set();if(W.days[d]&&W.days[d].rid)tried[d].add(W.days[d].rid);
  let next=ranking(w).find(x=>!used.has(x.r.id)&&!tried[d].has(x.r.id));
  if(!next){tried[d]=new Set();next=ranking(w).find(x=>!used.has(x.r.id));}
  if(!next){toast('Keine weiteren passenden Rezepte.');return;}
  patchWeek(w,{days:{[d]:{rid:next.r.id,skip:false,serv:(W.days[d]&&W.days[d].serv)||HH.serv}}});
}
function autoFinalize(){const W=WEEKS[NEXT_WEEK];const anyVotes=Object.values(VOTES).some(v=>v&&v.w&&v.w[NEXT_WEEK]&&Object.values(v.w[NEXT_WEEK]).some(s=>s>0));if(anyVotes&&new Date()>deadlineOf(NEXT_WEEK)&&!(W&&W.finalized))finalize(NEXT_WEEK);}

// ================= render =================
const SVG=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON={woche:SVG('<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
  einkauf:SVG('<path d="M5 8h14l-1.3 10.2a2 2 0 0 1-2 1.8H8.3a2 2 0 0 1-2-1.8z"/><path d="M9 11V7a3 3 0 0 1 6 0v4"/>'),
  rezepte:SVG('<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>'),
  tracker:SVG('<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>'),
  ich:SVG('<circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>'),
  no:SVG('<path d="M6 6l12 12M18 6L6 18"/>'),yes:SVG('<path d="M4.5 12.5l5 5 10-11"/>'),
  love:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.2 0 3.7 1.3 4.6 2.6.2.3.6.3.8 0 .9-1.3 2.4-2.6 4.6-2.6 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>'};
const TABS=[['woche','Woche'],['einkauf','Einkauf'],['rezepte','Rezepte'],['tracker','Tracker'],['ich','Ich']];
function renderTabs(){
  const tabs=document.getElementById('tabs');if(!SETUP){tabs.innerHTML='';return;}
  const fin=WEEKS[NEXT_WEEK]&&WEEKS[NEXT_WEEK].finalized;
  const open=fin?0:dinnerPool(NEXT_WEEK).filter(r=>scoreFor(myId,NEXT_WEEK,r.id)==null).length;
  tabs.innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" ${ui.tab===k?'aria-current="page"':''}>${ICON[k]}${l}${k==='woche'&&open?`<span class="badge">${open}</span>`:''}</button>`).join('');}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;ui.tab=b.dataset.tab;render();window.scrollTo(0,0);});
let pending=false;
function render(force){
  const ae=document.activeElement;
  if(!force&&ae&&document.getElementById('app').contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&ae.type!=='checkbox'){pending=true;return;}
  pending=false;renderTabs();const m=document.getElementById('app');
  if(!SETUP){m.innerHTML=vSetup();return;}
  m.innerHTML=({woche:vWeek,einkauf:vShop,rezepte:vRecipes,tracker:vTracker,ich:vMe})[ui.tab]();
  if(ui.tab==='tracker'&&!LOGS[ui.date])loadLog(ui.date).then(()=>render());
}
document.getElementById('app').addEventListener('focusout',()=>{if(pending)setTimeout(()=>{if(pending)render();},50);});
function mast(title,aside){return`<header class="mast"><h1>${title}</h1>${aside?`<div class="aside">${aside}</div>`:''}</header>`;}
function weekSeg(){const lab=w=>`${fmtD(w,{day:'numeric',month:'short'})} – ${fmtD(addDays(w,6),{day:'numeric',month:'short'})}`;
  return`<div class="seg">${[[THIS_WEEK,'Diese Woche'],[NEXT_WEEK,'Nächste Woche']].map(([w,l])=>`<button data-a="week" data-w="${w}" aria-pressed="${ui.week===w}">${l}<small>${lab(w)}</small></button>`).join('')}</div>`;}

// ---------- Einrichtung ----------
function vSetup(){
  const pre=new URLSearchParams(location.search).get('k')||'';
  return mast('Mmmh','<b>Willkommen.</b>Einmal einrichten, dann geht’s los.')+
  `<p>Hier plant ihr zu zweit die Woche: Gerichte abstimmen, Plan festlegen, gemeinsam einkaufen.</p>
  <div class="panel"><div class="formg">
   <label style="grid-column:1/-1">Dein Vorname<input type="text" id="suName" autocomplete="given-name" placeholder="z. B. Sabine"></label>
   <label style="grid-column:1/-1">Küchen-Code<input type="text" id="suCode" autocapitalize="none" autocorrect="off" spellcheck="false" value="${esc(pre)}" placeholder="z. B. sabine-pedro-kueche"></label></div>
   <p class="small muted" style="margin-top:10px">Denkt euch zusammen einen Code aus und gebt beide genau denselben ein. Wer den Code kennt, sieht eure gemeinsame Planung. Nehmt also lieber nichts zu Einfaches (mindestens 6 Zeichen).</p>
   <p class="small warn" id="suErr"></p>
   <button class="btn basil" data-a="setup" style="width:100%">Los geht's</button></div>`;
}
function doSetup(){
  const name=document.getElementById('suName').value.trim(),code=slug(document.getElementById('suCode').value);
  const err=document.getElementById('suErr');
  if(!name){err.textContent='Bitte deinen Vornamen eintragen.';return;}
  if(code.length<6){err.textContent='Der Code braucht mindestens 6 Zeichen (Buchstaben, Zahlen oder Bindestrich).';return;}

function shopNeeds(w){const W=weekDoc(w),need={};Object.values(W.days||{}).forEach(x=>{if(!x||!x.rid||x.skip||x.cooked)return;const r=R(x.rid);if(!r)return;r.ings.forEach(([id,a])=>{need[id]=(need[id]||0)+a*(x.serv||HH.serv)/BASE;});});return need;}

function activeFilters(){const f=ui.f,a=[];
  f.meal.forEach(m=>a.push(['meal',m,MEALS[m]]));f.diet.forEach(d=>a.push(['diet',d,DIETS[d]]));
  f.nut.forEach(n=>a.push(['nut',n,NUT[n][0]]));if(f.time)a.push(['time',f.time,'bis '+f.time+' Min.']);
  f.prep.forEach(p=>a.push(['prep',p,FLAGS[p]]));if(f.fav)a.push(['fav',1,'mit Lieblingszutaten']);if(f.own)a.push(['own',1,'Eigene Rezepte']);if(f.heart)a.push(['heart',1,'♥ Herz-Rezepte']);return a;}
const NUT={hp:['High Protein','mind. 25 g Protein oder 30 % der Kalorien'],lowfat:['Low Fat','max. 12 g Fett'],lowcarb:['Low Carb','max. 30 g Kohlenhydrate'],light:['Unter 500 kcal','pro Portion']};
function filtered(){
  const f=ui.f,qq=ui.q.trim().toLowerCase();
  return RECIPES.filter(r=>{
    if(f.meal.length&&!f.meal.some(m=>r.meals.includes(m)))return false;
    if(f.diet.length&&!f.diet.some(d=>d==='veg'?(r.diet==='veg'||r.diet==='vegan'):r.diet===d))return false;
    if(f.nut.some(n=>!r[n]))return false;
    if(f.time&&r.min>f.time)return false;
    if(f.prep.some(p=>!r.flags.includes(p)))return false;
    if(f.fav&&!likeScore(r))return false;
    if(f.own&&!r.own)return false;
    if(f.heart&&!hearted(r.id))return false;
    if(qq&&!(r.n.toLowerCase().includes(qq)||r.ings.some(([id])=>ING[id].n.toLowerCase().includes(qq))))return false;
    const av=recipeAvoid(r);if(!av.ok&&!(ME.showSubs&&av.fixable))return false;
    return true;}).sort((a,b)=>(hearted(b.id)-hearted(a.id))||likeScore(b)-likeScore(a)||a.n.localeCompare(b.n,'de'));
}
function lrow(r){const ls=likeScore(r),av=recipeAvoid(r);
  return`<button class="lrow" data-open="${r.id}"><div class="min">${r.min}<small>Min.</small></div><div><div class="t">${hearted(r.id)?'<span class="heart">♥</span> ':''}${esc(r.n)}</div><div class="s">${dietTag(r)}${r.meals.map(m=>MEALS[m]).join(', ')}${ls?` · ♥ ${ls}`:''}${!av.ok?' · <span class="warn">mit Ersatz</span>':''}</div>${mbar(r)}</div><div class="k"><b>${r0(r.per.k)}</b><br><span class="small muted">kcal</span><br><span class="small">${r0(r.per.p)} g P</span></div></button>`;}
function vRecipes(){

  `<div class="row" style="flex-wrap:nowrap;margin-bottom:10px"><input type="search" id="q" placeholder="Rezept oder Zutat suchen" value="${esc(ui.q)}"><button class="btn" data-a="filters">Filter${af.length?` (${af.length})`:''}</button></div>
  <div class="row" style="margin-bottom:12px"><button class="pill" data-a="heartf" aria-pressed="${ui.f.heart}">♥ Meine Herz-Rezepte (${(ME.hearts||[]).filter(id=>R(id)).length})</button></div>

async function onRecipeClick(e){

async function ocrImages(files,onStatus){
  const T=await loadOCR();const worker=await T.createWorker('deu',1,{logger:m=>{if(m.status==='recognizing text')onStatus(Math.round(m.progress*100));}});

}

function toUnit(id,amt,unit){

  let base=null,val=amt;
  if(/^(kg)$/.test(u)){base='g';val=amt*1000;}else if(/^(g|gr|gramm)$/.test(u))base='g';
  else if(/^(l|liter)$/.test(u)){base='ml';val=amt*1000;}else if(u==='ml')base='ml';
  else if(/^(el|esslöffel)$/.test(u)){base=target==='ml'?'ml':'g';val=amt*15;}else if(/^(tl|teelöffel)$/.test(u)){base=target==='ml'?'ml':'g';val=amt*5;}
  else if(/^(tasse|tassen|cup|cups)$/.test(u)){base=target==='ml'?'ml':'g';val=amt*(target==='ml'?240:150);}
  else if(/^becher$/.test(u)){base='g';val=amt*200;}

function parseRecipeText(raw){
  const lines=raw.replace(/\r/g,'').split('\n').filter(l=>!/^\s*[#@]/.test(l)).map(l=>l.replace(/\s+/g,' ').trim().replace(/^[^\p{L}\p{N}½¼¾⅓]+/u,'').trim()).filter(Boolean);
  const rows=[],steps=[];let name='',serv=null,min=null,inSteps=false;
  for(const l of lines){
    const sv=l.match(/(\d+)\s*(portionen|personen|pers\.|servings)/i);if(sv&&!serv)serv=+sv[1];
    const mn=l.match(/(\d+)\s*(min\.?|minuten)\b/i);if(mn&&!min&&!inSteps)min=+mn[1];
    if(/^(zubereitung|anleitung|so geht'?s|so wird'?s gemacht|schritte|instructions)/i.test(l)){inSteps=true;continue;}
    if(/^(zutaten|ingredients|du brauchst|für \d)/i.test(l)){inSteps=false;continue;}
    const st=l.match(/^(\d+)[.)]\s+(.{12,})$/);
    if(st&&!ING_RE.test(l.replace(/^\d+[.)]\s+/,''))){steps.push(st[2]);continue;}
    const m=!inSteps&&l.match(ING_RE);
    if(m){const what=m[3].replace(/^(von|vom|der|die|das)\s+/i,'').replace(/[,(].*$/,'').trim();
      if(!what||SKIP.test(what))continue;
      const id=matchIng(what),cv=toUnit(id,numOf(m[1]),m[2]);
      if(!(cv.amt>0))continue;
      if(id){const ex=rows.find(r=>r.id===id);if(ex){ex.amt=+(+ex.amt+cv.amt).toFixed(1);continue;}rows.push({id,amt:cv.amt});}
      else rows.push({id:'_other',name:what.charAt(0).toUpperCase()+what.slice(1),unit:cv.unit,amt:cv.amt,tag:''});
      continue;}
    if(inSteps&&l.length>12){steps.push(l);continue;}

  <div class="row" style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr"><button class="btn" data-a="addRecipe">+ Rezept</button><button class="btn" data-a="addFood">+ Anderes Essen</button></div>
  ${ME.favFoods.length?`<h2>Favoriten</h2><div class="row">${ME.favFoods.map((f,i)=>`<button class="pill" data-a="fav" data-i="${i}">${esc(f.name)}</button>`).join('')}</div>`:''}
  ${SLOTS.map(s=>{const es=entries.filter(e=>e.slot===s);if(!es.length)return'';return`<h2>${s}</h2><div class="group">${es.map(e=>`<div class="item"><div class="body"><b>${esc(e.name)}</b><div class="small muted">${e.portions?String(e.portions).replace('.',',')+' Portion(en) · ':''}${e.grams?r0(e.grams)+' g · ':''}${r0(e.k)} kcal · P ${r0(e.p)} · K ${r0(e.c)} · F ${r0(e.f)}</div></div><button class="link" data-a="delE" data-id="${e.id}">Löschen</button></div>`).join('')}</div>`;}).join('')}
  ${!entries.length?'<div class="empty" style="margin-top:16px">Noch nichts eingetragen.</div>':''}`;
}
async function addEntry(e){const k=ui.date;await loadLog(k);LOGS[k].push(Object.assign({id:uid(),t:Date.now()},e));saveLog(k);render();}
function foodForm(pre={}){
  openSheet(`<div class="sheet-head"><h2>Anderes Essen</h2><button class="x-btn" data-close aria-label="Schließen">×</button></div>
  ${pre.hint?`<p class="small muted">${esc(pre.hint)}</p>`:''}
  <div class="formg"><label style="grid-column:1/-1">Name<input type="text" id="fName" value="${esc(pre.name||'')}"></label>
  <label>Werte gelten für<select id="fBasis"><option value="100" ${pre.basis!=='portion'?'selected':''}>100 g / ml</option><option value="portion" ${pre.basis==='portion'?'selected':''}>1 Portion</option></select></label>
  <label id="gW">Gegessen (g / ml)<input type="number" inputmode="decimal" id="fGrams" value="${pre.grams||''}" min="0"></label>
  <label>kcal<input type="number" inputmode="decimal" id="fK" value="${pre.k??''}" step="any"></label><label>Protein g<input type="number" inputmode="decimal" id="fP" value="${pre.p??''}" step="any"></label>
  <label>Kohlenhydrate g<input type="number" inputmode="decimal" id="fC" value="${pre.c??''}" step="any"></label><label>Fett g<input type="number" inputmode="decimal" id="fF" value="${pre.f??''}" step="any"></label>
  <label>Mahlzeit<select id="fSlot">${SLOTS.map(s=>`<option ${s===slotNow()?'selected':''}>${s}</option>`).join('')}</select></label>
  <label style="flex-direction:row;align-items:center;gap:8px;margin-top:22px"><input type="checkbox" id="fFav"> Als Favorit merken</label></div>
  <p class="small warn" id="fErr"></p><button class="btn basil" id="fSave" style="width:100%">Eintragen</button>`);
  const sync=()=>document.getElementById('gW').style.display=document.getElementById('fBasis').value==='100'?'flex':'none';document.getElementById('fBasis').onchange=sync;sync();
  document.getElementById('fSave').onclick=()=>{const v=id=>{const x=document.getElementById(id).value;return x===''?NaN:+x;};
    const name=document.getElementById('fName').value.trim(),basis=document.getElementById('fBasis').value,vals={k:v('fK'),p:v('fP')||0,c:v('fC')||0,f:v('fF')||0};
    if(!name||isNaN(vals.k)){document.getElementById('fErr').textContent='Bitte mindestens Name und kcal ausfüllen.';return;}
    let m=1,grams=null;if(basis==='100'){grams=v('fGrams');if(!(grams>0)){document.getElementById('fErr').textContent='Bitte die gegessene Menge angeben.';return;}m=grams/100;}
    if(document.getElementById('fFav').checked){ME.favFoods.push({name,basis,...vals,grams});saveMe();}
    addEntry({slot:document.getElementById('fSlot').value,name,grams,k:vals.k*m,p:vals.p*m,c:vals.c*m,f:vals.f*m});closeSheet();toast('Eingetragen');};
}
function recipePicker(){openSheet(`<div class="sheet-head"><h2>Rezept eintragen</h2><button class="x-btn" data-close aria-label="Schließen">×</button></div><div class="ledger">${RECIPES.slice().sort((a,b)=>a.n.localeCompare(b.n,'de')).map(lrow).join('')}</div>`);
  document.querySelector('.sheet').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(!b)return;e.stopPropagation();closeSheet();openRecipe(b.dataset.open);});}

// ---------- Ich ----------
function labelPref(v){const [t,id]=v.split(':');return t==='cat'?CATS[id]:ING[id]?ING[id].n:id;}
function shareLink(){return location.origin+location.pathname+'?k='+encodeURIComponent(SETUP.code);}
function vMe(){
  const ingOpts=Object.values(ING).filter(i=>!i.custom).sort((a,b)=>a.n.localeCompare(b.n,'de'));
  const st=mode!=='db'?['','Nicht verbunden – Daten liegen nur auf diesem Gerät']:SYNC==='on'?['on','Verbunden']:SYNC==='err'?['err','Verbindungsproblem – Änderungen werden nachgeholt']:['','Verbinde …'];
  return mast('Ich',`<b>${esc(SETUP.name)}</b>deine Einstellungen`)+
  `<h2>Das esse ich nicht</h2><p class="small muted">Rezepte damit werden ausgeblendet oder mit Ersatz gezeigt. Bei der Abstimmung zählen sie als dein „Nein“, wenn es keinen Ersatz gibt.</p>
  <div class="row" style="margin:8px 0">${ME.avoid.map(v=>`<button class="pill x" data-a="rmAv" data-v="${v}">${esc(labelPref(v))}</button>`).join('')||'<span class="muted small">Noch nichts.</span>'}</div>
  <select id="addAvoid"><option value="">Hinzufügen …</option><optgroup label="Gruppen">${Object.entries(CATS).filter(([k])=>!ME.avoid.includes('cat:'+k)).map(([k,l])=>`<option value="cat:${k}">${l}</option>`).join('')}</optgroup><optgroup label="Zutaten">${ingOpts.filter(i=>!ME.avoid.includes('ing:'+i.id)).map(i=>`<option value="ing:${i.id}">${esc(i.n)}</option>`).join('')}</optgroup></select>
  <h2>Mag ich besonders</h2><p class="small muted">Rezepte damit stehen weiter oben.</p>
  <div class="row" style="margin:8px 0">${ME.likes.map(v=>`<button class="pill x" data-a="rmLk" data-v="${v}">${esc(labelPref(v))}</button>`).join('')||'<span class="muted small">Noch nichts.</span>'}</div>
  <select id="addLike"><option value="">Hinzufügen …</option>${ingOpts.filter(i=>!ME.likes.includes('ing:'+i.id)).map(i=>`<option value="ing:${i.id}">${esc(i.n)}</option>`).join('')}</select>
  <h2>Tagesziele</h2><p class="small muted">Optional, für die Balken im Tracker.</p>
  <div class="formg" style="margin-top:8px">${[['k','kcal'],['p','Protein g'],['c','Kohlenhydrate g'],['f','Fett g']].map(([k,l])=>`<label>${l}<input type="number" inputmode="numeric" data-goal="${k}" value="${esc(ME.goals[k])}" min="0"></label>`).join('')}</div>
  ${ME.favFoods.length?`<h2>Favoriten</h2><div class="row">${ME.favFoods.map((f,i)=>`<button class="pill x" data-a="rmFav" data-i="${i}">${esc(f.name)}</button>`).join('')}</div>`:''}
  <h2>Gemeinsam nutzen</h2>
  <div class="panel"><p><span class="sync ${st[0]}"></span>${st[1]}</p>
   <p>Küchen-Code: <b>${esc(SETUP.code)}</b></p>
   <p class="small muted">Wer denselben Code eingibt, sieht Woche, Einkauf und eigene Rezepte mit. Tracker und diese Seite bleiben für jede:n privat.</p>
   <div class="row"><button class="btn sm" data-a="share">Einladung teilen</button><button class="btn ghost sm" data-a="reset">Code oder Namen ändern</button></div></div>
  <h2>Als App installieren</h2><p class="small muted">iPhone: in Safari unten auf „Teilen“ tippen, dann „Zum Home-Bildschirm“. Android: im Chrome-Menü „App installieren“.</p>`;
}

// ================= events =================
const app=document.getElementById('app');
app.addEventListener('click',e=>{
  const hb=e.target.closest('[data-heart]');if(hb){e.stopPropagation();toggleHeart(hb.dataset.heart);render();return;}
  const v=e.target.closest('[data-vote]');if(v){vote(v.dataset.r,+v.dataset.vote);return;}
  const o=e.target.closest('[data-open]');if(o){openRecipe(o.dataset.open);return;}
  const t=e.target.closest('[data-a]');if(!t||t.tagName==='DETAILS')return;
  const a=t.dataset.a;const w=ui.week;
  if(a==='setup'){doSetup();}
  else if(a==='week'){ui.week=t.dataset.w;render();}
  else if(a==='final'){finalize(w);}
  else if(a==='unfinal'){if(confirm('Plan aufheben und weiter abstimmen? Die Stimmen bleiben erhalten.'))patchWeek(w,{finalized:false});}
  else if(a==='din-'||a==='din+'){HH.dinners=Math.max(1,Math.min(7,HH.dinners+(a==='din+'?1:-1)));saveHH();render();}
  else if(a==='pz-'||a==='pz+'){HH.pause=Math.max(0,Math.min(6,(HH.pause||0)+(a==='pz+'?1:-1)));saveHH();render();}
  else if(a==='srv-'||a==='srv+'){HH.serv=Math.max(1,Math.min(12,HH.serv+(a==='srv+'?1:-1)));saveHH();render();}
  else if(a==='undo'&&ui.undo){const v=myVotes();if(v.w[ui.undo.w])delete v.w[ui.undo.w][ui.undo.r];ui.undo=null;saveVotes();render();}
  else if(a==='swap'){replaceDay(w,t.dataset.d);}
  else if(a==='ate'){eatPlanned(w,t.dataset.d).then(()=>toast('In deinen Tracker eingetragen und als gekocht markiert'));}
  else if(a==='uncook'){patchWeek(w,{days:{[t.dataset.d]:{cooked:false}}});}
  else if(a==='skip'){const x=weekDoc(w).days[t.dataset.d]||{};patchWeek(w,{days:{[t.dataset.d]:{skip:!x.skip}}});}
  else if(a==='unskip'){patchWeek(w,{days:{[t.dataset.d]:{skip:false}}});replaceDay(w,t.dataset.d);}
  else if(a==='exadd'){const inp=document.getElementById('exIn');const val=inp.value.trim();if(!val)return;inp.value='';inp.blur();patchWeek(w,{extras:{[uid()]:{t:val,done:false}}});}
  else if(a==='exdel'){e.preventDefault();patchWeek(w,{extras:{[t.dataset.k]:null}});}
  else if(a==='clearBuy'){const W=weekDoc(w);const b={};Object.keys(W.bought||{}).forEach(k=>b[k]=false);const ex={};Object.keys(W.extras||{}).forEach(k=>{if(W.extras[k])ex[k]={done:false};});patchWeek(w,{bought:b,extras:ex});}
  else if(a==='filters')filterSheet();
  else if(a==='heartf'){ui.f.heart=!ui.f.heart;render();}
  else if(a==='rmf'){const g=t.dataset.g,val=t.dataset.v;if(Array.isArray(ui.f[g]))ui.f[g]=ui.f[g].filter(x=>x!==val);else ui.f[g]=g==='time'?0:false;render();}
  else if(a==='clearf'){ui.f={meal:[],diet:[],nut:[],time:0,prep:[],fav:false,own:false,heart:false};render();}
  else if(a==='newRec')newRecipeSheet();
  else if(a==='day-'){ui.date=addDays(ui.date,-1);render();}
  else if(a==='day+'&&ui.date!==dkey()){ui.date=addDays(ui.date,1);render();}
  else if(a==='addRecipe')recipePicker();
  else if(a==='addFood')foodForm();
  else if(a==='fav'){const f=ME.favFoods[+t.dataset.i];if(f.basis==='100')foodForm({...f});else{addEntry({slot:slotNow(),name:f.name,portions:1,k:f.k,p:f.p,c:f.c,f:f.f});toast('Eingetragen');}}
  else if(a==='delE'){LOGS[ui.date]=(LOGS[ui.date]||[]).filter(x=>x.id!==t.dataset.id);saveLog(ui.date);render();}
  else if(a==='rmAv'){ME.avoid=ME.avoid.filter(x=>x!==t.dataset.v);saveMe();render();}
  else if(a==='rmLk'){ME.likes=ME.likes.filter(x=>x!==t.dataset.v);saveMe();render();}
  else if(a==='rmFav'){ME.favFoods.splice(+t.dataset.i,1);saveMe();render();}
  else if(a==='share'){const url=shareLink(),text=`Lass uns zusammen planen, was wir kochen. Öffne den Link, gib deinen Namen ein, der Küchen-Code „${SETUP.code}“ ist schon drin:`;
    if(navigator.share)navigator.share({title:'Mmmh',text,url}).catch(()=>{});
    else if(navigator.clipboard)navigator.clipboard.writeText(text+' '+url).then(()=>toast('Link kopiert'),()=>prompt('Link kopieren:',url));
    else prompt('Link kopieren:',url);}
  else if(a==='reset'){if(confirm('Code oder Namen neu eingeben? Eure gemeinsamen Daten bleiben unter dem alten Code gespeichert.')){try{localStorage.removeItem('fk-setup');}catch(e){}location.href=location.pathname;}}
});
app.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.a==='daysToggle')ui.daysOpen=d.open;},true);
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='exIn'){e.preventDefault();document.querySelector('[data-a="exadd"]').click();}if(e.key==='Enter'&&(e.target.id==='suName'||e.target.id==='suCode')){e.preventDefault();doSetup();}});
app.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;const pos=e.target.selectionStart;render(true);const el=document.getElementById('q');if(el){el.focus();el.setSelectionRange(pos,pos);}}
});
app.addEventListener('change',e=>{
  const t=e.target,w=ui.week;
  if(t.dataset.buy){patchWeek(w,{bought:{[t.dataset.buy]:t.checked?myId:false}});}
  else if(t.dataset.ex){patchWeek(w,{extras:{[t.dataset.ex]:{done:t.checked?myId:false}}});}
  else if(t.dataset.goal){ME.goals[t.dataset.goal]=t.value;saveMe();}
  else if(t.id==='addAvoid'&&t.value){ME.avoid.push(t.value);saveMe();render(true);}
  else if(t.id==='addLike'&&t.value){ME.likes.push(t.value);saveMe();render(true);}
});
// Gericht aus dem Plan gegessen: in den eigenen Tracker, Tag für beide als gekocht markieren
async function eatPlanned(w,d,portions=1){
  const x=weekDoc(w).days[d]||{},r=x.rid&&R(x.rid);if(!r)return;
  const today=dkey(),k=d<today?d:today,slot=k===today&&slotNow()!=='Snack'?slotNow():'Abendessen';
  await loadLog(k);LOGS[k].push({id:uid(),t:Date.now(),slot,name:r.n,portions,k:r.per.k*portions,p:r.per.p*portions,c:r.per.c*portions,f:r.per.f*portions});saveLog(k);
  patchWeek(w,{days:{[d]:{cooked:x.cooked||myId,ate:{[myId]:true}}}});
}
function plannedDay(rid){for(const w of [THIS_WEEK,NEXT_WEEK]){const W=WEEKS[w];if(!W||!W.days)continue;const d=Object.keys(W.days).sort().find(d=>W.days[d]&&W.days[d].rid===rid&&!W.days[d].skip&&!(W.days[d].ate&&W.days[d].ate[myId])&&d<=dkey());if(d)return{w,d};}return null;}
function vote(rid,s){const w=ui.week;const v=myVotes();v.w[w]=v.w[w]||{};v.w[w][rid]=s;ui.undo={w,r:rid};saveVotes();render();}

function openSheet(html){const root=document.getElementById('sheet-root');root.innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  document.getElementById('sbg').addEventListener('click',e=>{if(e.target.id==='sbg'||e.target.closest('[data-close]'))closeSheet();});}
function closeSheet(){document.getElementById('sheet-root').innerHTML='';if(pending)render();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
// Neue Woche angebrochen, während die App im Hintergrund offen war → neu laden
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&mondayOf()!==THIS_WEEK)location.reload();});

// ================= boot =================
(function(){const L=lsGet('fk2');if(L){ME=Object.assign(clone(P_DEF),L.ME||{});HH=Object.assign(HH,L.HH||{});WEEKS=L.WEEKS||{};VOTES=L.VOTES||{};CUSTOM=L.CUSTOM||{};}})();
if(SETUP){myId=SETUP.id;if(VOTES.me&&!VOTES[myId]){VOTES[myId]=VOTES.me;}delete VOTES.me;}
rebuildRecipes();
if(WEEKS[NEXT_WEEK]&&WEEKS[NEXT_WEEK].finalized&&!WEEKS[THIS_WEEK])ui.week=NEXT_WEEK;
render();
(async()=>{
  if(!SETUP)return;
  try{
    const d=await connectCloud(SETUP.code);
    db=d;mode='db';setSync('connecting');
    write('member',()=>db.doc('members/'+myId).set({name:SETUP.name,seen:Date.now()}));
    try{const s=await db.doc(`data/users/${myId}/p/settings`).get();if(s.exists)ME=Object.assign(clone(P_DEF),clone(s.data()));else saveMe();}catch(e){console.warn(e)}
    LOGS={};
    db.collection('members').onSnapshot(s=>{s.docs.forEach(x=>{if(x.exists&&x.data().name)names[x.id]=x.data().name;});render();},e=>console.warn(e));
    db.doc('household/main').onSnapshot(s=>{if(s.exists)HH=Object.assign({dinners:7,serv:4,pause:2},clone(s.data()));else saveHH();render();},e=>console.warn(e));
    db.collection('recipes').onSnapshot(s=>{const c={};s.docs.forEach(x=>{if(x.exists)c[x.id]=clone(x.data());});CUSTOM=c;rebuildRecipes();persistLocal();render();},e=>console.warn(e));
    db.collection('votes').onSnapshot(s=>{const mine=VOTES[myId];const v={};s.docs.forEach(x=>{if(x.exists)v[x.id]=clone(x.data());});if(!v[myId]&&mine){v[myId]=mine;saveVotes();}VOTES=v;persistLocal();render();},e=>console.warn(e));
    let fin=false;
    [THIS_WEEK,NEXT_WEEK].forEach(w=>db.doc('weeks/'+w).onSnapshot(s=>{if(s.exists)WEEKS[w]=deepMerge(emptyWeek(),clone(s.data()));else delete WEEKS[w];
      persistLocal();if(w===NEXT_WEEK&&!fin){fin=true;setTimeout(autoFinalize,1500);}render();},e=>console.warn(e)));
    [7,14,21,28,35,42].forEach(n=>{const w=addDays(THIS_WEEK,-n);db.doc('weeks/'+w).get().then(s=>{if(s.exists){WEEKS[w]=deepMerge(emptyWeek(),clone(s.data()));render();}}).catch(()=>{});});
    syncVeto();
  }catch(e){console.warn(e);setSync('err');toast('Keine Verbindung. Die App speichert erstmal nur auf diesem Gerät.');autoFinalize();}
  render();
})();
</script>
