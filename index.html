<style>

}
/* immer dunkel */
:root{
  --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.32);
  --ink:#FFFFFF;--muted:rgba(235,235,245,.6);--line:rgba(84,84,88,.6);

  --warn:#FF453A;--bar:rgba(22,22,24,.82);}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

/* large title */

.item{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative;background:var(--card)}
.group .item{background:none}

.item input[type=checkbox]{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #C7C7CC;margin:0;flex:none;display:grid;place-content:center;background:none}

.ing li{padding:10px 0;border-bottom:.5px solid var(--line);list-style:none}

.ing{padding:0;margin:0}
.ing .l{display:flex;justify-content:space-between;gap:10px}

.subs{font-size:14px;color:var(--muted);margin-top:4px}
ol.steps{padding-left:22px;margin:0}ol.steps li{margin-bottom:10px;line-height:1.45}
.panel{border-radius:12px;padding:14px 16px;margin:12px 0;background:var(--card)}

.formg{display:grid;grid-template-columns:1fr 1fr;gap:10px}

// nutrition per 100 g/ml, or per piece for unit "Stk"
const SB=(n,t=[])=>({n,t});

const MEALS={F:'Frühstück',M:'Mittag',A:'Abendessen'};

const THIS_WEEK=mondayOf(),NEXT_WEEK=addDays(THIS_WEEK,7);

const FB_CFG={apiKey:"AIzaSyDBeS_N564vAqpdFEuTXtwmRq1NQxJyTGo",authDomain:"ausgaben-ac792.firebaseapp.com",projectId:"ausgaben-ac792",storageBucket:"ausgaben-ac792.firebasestorage.app",messagingSenderId:"1036481285970",appId:"1:1036481285970:web:c442d03361f44a9185348b"};

// Kleine Hülle um Firestore: alle Daten eines Küchen-Codes liegen unter familienkueche/{code}/…
async function connectCloud(code){
  const A=await import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-app.js`);
  const F=await import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-firestore.js`);
  const app=A.initializeApp(FB_CFG);let fs;
  // Offline-Speicher: Änderungen ohne Internet bleiben auch nach dem Schließen erhalten und werden später hochgeladen
  try{fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});}catch(e){console.warn(e);fs=F.getFirestore(app);}
  CLOUD={F,fs};
  const root=['familienkueche',code];
  const ref=p=>{const s=p.split('/');return s.length===2?F.doc(fs,...root,s[0],s[1]):F.doc(fs,...root,'misc',s.join('~'));};
  const snap=s=>({exists:s.exists(),id:s.id,data:()=>s.data(),cache:!!(s.metadata&&s.metadata.fromCache),pending:!!(s.metadata&&s.metadata.hasPendingWrites)});
  const ok=()=>setSync('on'),bad=e=>{console.warn(e);setSync('err');};
  return{
    doc:p=>{const r=ref(p);return{
      get:async()=>snap(await F.getDoc(r)),
      set:d=>F.setDoc(r,d),
      update:d=>F.setDoc(r,d,{merge:true}),
      delete:()=>F.deleteDoc(r),
      onSnapshot:(cb,err)=>F.onSnapshot(r,s=>{ok();cb(snap(s));},e=>{bad(e);err&&err(e);})};},
    collection:n=>({onSnapshot:(cb,err)=>F.onSnapshot(F.collection(fs,...root,n),{includeMetadataChanges:false},s=>{ok();cb({docs:s.docs.map(snap),cache:!!s.metadata.fromCache});},e=>{bad(e);err&&err(e);})})
  };
}
let SYNC='off',CLOUD=null;
function setSync(s){if(SYNC===s)return;SYNC=s;if(ui.tab==='ich')render();}

let RECIPES=[],CUSTOM={};
function nutrOf(i,amt){const f=i.u==='Stk'?amt:amt/100;return{k:i.k*f,p:i.p*f,c:i.c*f,f:i.f*f};}
function buildRecipe(id,n,meals,min,ings,steps,flags,own,extra){
  const tot={k:0,p:0,c:0,f:0},tags=new Set();
  ings.forEach(([iid,a])=>{const i=ING[iid];if(!i)return;const x=nutrOf(i,a);for(const k in tot)tot[k]+=x[k];i.tags.forEach(t=>tags.add(t));});
  const per={k:tot.k/BASE,p:tot.p/BASE,c:tot.c/BASE,f:tot.f/BASE};
  const diet=tags.has('meat')?'meat':tags.has('fish')?'fish':(tags.has('dairy')||tags.has('egg')||tags.has('nonvegan'))?'veg':'vegan';
  const kc=per.k||1;
  return{id,n,meals,min,ings,steps,flags:flags||'',per,tags,diet,own:!!own,src:extra&&extra.src||'',img:extra&&extra.img||'',web:extra&&extra.web||'',
    hp:per.p>=25||per.p*4/kc>=0.3,lowfat:per.f<=12,lowcarb:per.c<=30,light:per.k<=500};
}
function rebuildRecipes(){
  RECIPES=REC_RAW.map(r=>{const x=REC_IMG[r[0]];const b=buildRecipe(r[0],r[1],r[2].split(''),r[3],r[4],r[5],r[6],false,x?{img:x[0]}:null);if(x){b.credit=x[1];b.creditUrl=x[2];}return b;});
  (typeof WEB_RAW!=='undefined'?WEB_RAW:[]).forEach(r=>{const x=r[7]||{};if(x.rel&&x.rel>dkey())return;
    const rr=buildRecipe(r[0],r[1],r[2].split(''),r[3],r[4],r[5],r[6],false,x);rr.rel=x.rel||'';if(x.vegan){rr.diet='vegan';['dairy','egg','nonvegan','meat','fish'].forEach(t=>rr.tags.delete(t));}RECIPES.push(rr);});
  Object.entries(CUSTOM).forEach(([rid,c])=>{
    if(!c||!c.n||!Array.isArray(c.ings))return;
    const f=BASE/(c.serv||BASE);const ings=[];
    c.ings.forEach((x,i)=>{
      let id=x.id&&ING[x.id]&&!String(x.id).startsWith('x_')?x.id:null;
      if(!id){id='x_'+rid+'_'+i;const u=['g','ml','Stk'].includes(x.unit)?x.unit:'g';
        ING[id]={id,n:x.name||'Zutat',u,k:+x.k||0,p:+x.p||0,c:+x.c||0,f:+x.f||0,tags:Array.isArray(x.tags)?x.tags.filter(t=>CATS[t]||t==='nonvegan'):[],pack:u==='Stk'?1:(u==='ml'?500:250),pantry:false,subs:[],custom:true,nonut:!(+x.k)};}
      ings.push([id,(+x.amt||0)*f]);
    });
    const rr=buildRecipe(rid,c.n,(c.meals||['A']).filter(m=>MEALS[m]),+c.min||30,ings,c.steps||[],c.flags||'',true,{src:c.src,img:c.img,web:c.web});
    if(c.vegan){rr.diet='vegan';['dairy','egg','nonvegan','meat','fish'].forEach(t=>rr.tags.delete(t));}
    if(c.per&&c.per.k>0){rr.per=c.per;const kc=c.per.k||1;rr.hp=c.per.p>=25||c.per.p*4/kc>=0.3;rr.lowfat=c.per.f<=12;rr.lowcarb=c.per.c<=30;rr.light=c.per.k<=500;}
    RECIPES.push(rr);
  });
}

function deepMerge(t,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])){if(!t[k]||typeof t[k]!=='object')t[k]={};deepMerge(t[k],s[k]);}else t[k]=s[k];}return t;}

function toggleKey(keys,k){if(keys.includes(k))return keys.filter(x=>x!==k);const f=FKEY[k];return keys.filter(x=>!(f.mode==='one'&&FKEY[x]&&FKEY[x].g===f.g)).concat(k);}

const wkIng=(vid,w)=>{const x=VOTES[vid]&&VOTES[vid].ing&&VOTES[vid].ing[w];return{like:(x&&x.like)||[],dis:(x&&x.dis)||[]};};

  Object.keys(VOTES).forEach(v=>{const p=wkIng(v,w);sc+=2*p.like.filter(i=>prefMatch(i,r)).length-3*p.dis.filter(i=>prefMatch(i,r)).length;});

const dinnerPool=(w=ui.week)=>{const rec=recentRids(w),fo=focusOf(w);return RECIPES.filter(r=>(r.meals.includes('A')||r.meals.includes('M'))&&!rec.has(r.id)&&passes(r,fo));};

  return pool.filter(r=>!picks.has(r.id)).sort((a,b)=>pri(b)-pri(a)||ingScore(b,w)-ingScore(a,w)||hash(w+a.id)-hash(w+b.id));}

  if(W.finalized){const ds=weekDates(w);if(ds.some(d=>W.days[d]&&W.days[d].rid===rid)){toast('Ist schon im Plan');return;}
    const d=ds.find(d=>!(W.days[d]&&W.days[d].rid)&&!(W.days[d]&&W.days[d].skip))||ds.find(d=>d>=dkey()&&W.days[d]&&W.days[d].skip)||ds.slice().reverse().find(d=>!(W.days[d]&&W.days[d].cooked));
    if(!d){toast('Kein freier Tag mehr in dieser Woche');return;}
    patch.days={[d]:{rid,skip:false,serv:(W.days[d]&&W.days[d].serv)||HH.serv,cooked:false}};
    patchWeek(w,patch);toast(`${r.n} ist am ${fmtD(d,{weekday:'long'})} eingeplant`);return;}

function replaceDay(w,d){
  const W=weekDoc(w);const used=new Set(Object.values(W.days||{}).map(x=>x&&x.rid).filter(Boolean));
  tried[d]=tried[d]||new Set();if(W.days[d]&&W.days[d].rid)tried[d].add(W.days[d].rid);

const TABS=[['woche','Woche'],['favoriten','Favoriten'],['einkauf','Einkauf'],['rezepte','Rezepte'],['tracker','Tracker'],['ich','Ich']];
function renderTabs(){
  const tabs=document.getElementById('tabs');if(!SETUP){tabs.innerHTML='';return;}
  const fin=WEEKS[NEXT_WEEK]&&WEEKS[NEXT_WEEK].finalized;
  const open=fin?0:openFor(myId,NEXT_WEEK).length;
  tabs.innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" ${ui.tab===k?'aria-current="page"':''}>${ICON[k]}${l}${k==='woche'&&open?`<span class="badge">${open}</span>`:''}</button>`).join('');}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;ui.tab=b.dataset.tab;render();window.scrollTo(0,0);});
let pending=false;
function render(force){
  const ae=document.activeElement;
  if(!force&&ae&&document.getElementById('app').contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&ae.type!=='checkbox'){pending=true;return;}
  pending=false;renderTabs();const m=document.getElementById('app');
  if(!SETUP){m.innerHTML=vSetup();return;}
  if(ui.tab==='woche'||ui.tab==='favoriten')maintainSugg(ui.week);
  m.innerHTML=({woche:vWeek,favoriten:vFav,einkauf:vShop,rezepte:vRecipes,tracker:vTracker,ich:vMe})[ui.tab]();
  if(ui.tab==='tracker'&&!LOGS[ui.date])loadLog(ui.date).then(()=>render());
}
document.getElementById('app').addEventListener('focusout',()=>{if(pending)setTimeout(()=>{if(pending)render();},50);});
function mast(title,aside){return`<header class="mast"><h1>${title}</h1>${aside?`<div class="aside">${aside}</div>`:''}</header>`;}
function weekSeg(){const lab=w=>`${fmtD(w,{day:'numeric',month:'short'})} – ${fmtD(addDays(w,6),{day:'numeric',month:'short'})}`;
  return`<div class="seg">${[[THIS_WEEK,'Diese Woche'],[NEXT_WEEK,'Nächste Woche']].map(([w,l])=>`<button data-a="week" data-w="${w}" aria-pressed="${ui.week===w}">${l}<small>${lab(w)}</small></button>`).join('')}</div>`;}

// ---------- Einrichtung ----------
function vSetup(){
  const pre=new URLSearchParams(location.search).get('k')||'';
  return mast('Mmmh','<b>Willkommen.</b>Einmal einrichten, dann geht’s los.')+
  `<p>Hier plant ihr zu zweit die Woche: Gerichte abstimmen, Plan festlegen, gemeinsam einkaufen.</p>
  <div class="panel"><div class="formg">
   <label style="grid-column:1/-1">Dein Vorname<input type="text" id="suName" autocomplete="given-name" placeholder="z. B. Sabine"></label>
   <label style="grid-column:1/-1">Küchen-Code<input type="text" id="suCode" autocapitalize="none" autocorrect="off" spellcheck="false" value="${esc(pre)}" placeholder="z. B. sabine-pedro-kueche"></label></div>
   <p class="small muted" style="margin-top:10px">Denkt euch zusammen einen Code aus und gebt beide genau denselben ein. Wer den Code kennt, sieht eure gemeinsame Planung. Nehmt also lieber nichts zu Einfaches (mindestens 6 Zeichen).</p>
   <p class="small warn" id="suErr"></p>

function doSetup(){
  const name=document.getElementById('suName').value.trim(),code=slug(document.getElementById('suCode').value);
  const err=document.getElementById('suErr');
  if(!name){err.textContent='Bitte deinen Vornamen eintragen.';return;}
  if(code.length<6){err.textContent='Der Code braucht mindestens 6 Zeichen (Buchstaben, Zahlen oder Bindestrich).';return;}
  lsSet('fk-setup',{code,id:'u-'+slug(name),name});
  location.href=location.pathname;
}

  const mi=wkIng(myId,w),others0=Object.keys(VOTES).filter(v=>v!==myId);

function shopNeeds(w){const W=weekDoc(w),need={},P=participants(),add=(k,a)=>{need[k]=(need[k]||0)+a;};
  Object.values(W.days||{}).forEach(x=>{if(!x||!x.rid||x.skip||x.cooked)return;const r=R(x.rid);if(!r)return;const serv=x.serv||HH.serv;
    r.ings.forEach(([id,a])=>{const amt=a*serv/BASE,share=amt/P.length;let keep=0;
      P.forEach(v=>{const L=avoidOf(v);if(!avoidsIng(L,id)){keep+=share;return;}const sub=subFor(id,L);if(!sub)return;const m=subIng(sub);
        if(m.id)add(m.id,convU(share*m.f,ING[id].u,ING[m.id].u));else add('~'+sub.n.replace(/\s*\(.*\)/,'')+'|'+ING[id].u,share*m.f);});
      if(keep>0)add(id,keep);});});return need;}

function pieceG(name,id){const n=(name||'').toLowerCase();const db=NUTRI[n]||Object.values(NUTRI).find(r=>r[6]&&n&&(r[0].toLowerCase().startsWith(n)||n.startsWith(r[0].toLowerCase())));
  return(db&&db[6])||(id&&PIECE_G[id])||(OWN_ING[n]&&OWN_ING[n].pg)||100;}
// Strenger als matchIng: nur ganze Wörter (oder Mehrzahl), damit z. B. „Zitronengras“ nicht als Zitrone erkannt wird
function strictIng(t){const l=' '+t.toLowerCase().replace(/[^a-zäöüß ]/g,' ').replace(/\s+/g,' ').trim()+' ';
  for(const [k,id] of SYN_LIST){const kk=k.trim();if(kk.includes(' ')){if(l.includes(' '+kk+' '))return id;continue;}
    for(const w of l.trim().split(' ')){if(w===kk||(w.startsWith(kk)&&w.length-kk.length<=2&&/^(n|en|e|s|er)$/.test(w.slice(kk.length))))return id;}}return null;}
// Zutat → Nährwerte automatisch zuordnen
function resolveRow(x){const t=x.name.trim(),l=t.toLowerCase();x.m=null;if(!t)return;
  const ex=Object.values(ING).find(i=>!i.custom&&(i.n.toLowerCase()===l||i.n.toLowerCase().replace(/\s*\(.*\)/,'')===l));
  const id=ex?ex.id:strictIng(t);
  if(id&&ING[id]){const i=ING[id];x.m={type:'ing',id,name:i.n,k:i.k,p:i.p,c:i.c,f:i.f,base:i.u};if(!x.amtTouched&&x.unit==='g'&&i.u!=='g')x.unit=i.u;return;}
  const own=OWN_ING[l];if(own){x.m={type:'own',name:own.n,k:own.k,p:own.p,c:own.c,f:own.f,base:own.u||'g',pg:own.pg,tags:own.tags||[]};return;}
  let db=NUTRI[l];if(!db){const words=l.split(/[\s,()/-]+/).filter(Boolean),same=(a,b)=>a===b||(a.startsWith(b)&&/^(n|en|e|s|er)$/.test(a.slice(b.length)))||(b.startsWith(a)&&/^(n|en|e|s|er)$/.test(b.slice(a.length)));
    const c=NUTRI_DB.filter(r=>{const n=r[0].toLowerCase();if(l.length>=3&&n.startsWith(l))return true;const nw=n.split(/[\s,()/-]+/).filter(Boolean);return nw.some(a=>words.some(b=>b.length>3&&(same(a,b)||(b.length>4&&a.endsWith(b)))));});
    c.sort((a,b)=>a[0].length-b[0].length);db=c[0];}
  if(db){x.m={type:'db',name:db[0],k:db[1],p:db[2],c:db[3],f:db[4],base:db[7]||'g',pg:db[6]||0,tags:[...db[5]].map(c=>TAGMAP[c]).filter(Boolean)};if(!x.amtTouched&&x.unit==='g'&&db[7]==='ml')x.unit='ml';return;}
  x.m={type:'pending'};offLookup(t).then(r=>{if(x.name.trim()!==t)return;x.m=r?{type:'off',name:r.name,k:r.k,p:r.p,c:r.c,f:r.f,base:'g',tags:[]}:{type:'none'};if(document.getElementById('nrName')){readNew();drawNew();}});}
// Open Food Facts: besten passenden Eintrag automatisch wählen
async function offLookup(term,tries=2){const key=term.toLowerCase();if(key in offCache)return offCache[key];
  try{const r=await fetch('https://de.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(term)+'&search_simple=1&action=process&json=1&page_size=20&fields=product_name,nutriments');
    const d=await r.json();const bad=/chips|praline|pesto|sauce|soße|mayo|creme|riegel|keks|schoko|eis|getränk|drink|aufstrich|dip|pizza|snack/i;
    const best=(d.products||[]).map(p=>{const n=p.nutriments||{},name=String(p.product_name||'').trim();const k=+n['energy-kcal_100g'];if(!name||!(k>=0))return null;
      const ln=name.toLowerCase();let sc=0;if(ln.startsWith(key))sc+=4;if(ln.includes(key))sc+=2;if(bad.test(ln)&&!bad.test(key))sc-=5;sc-=name.split(/\s+/).length*0.3;
      const r={sc,name,k:+k,p:+(n.proteins_100g||0),c:+(n.carbohydrates_100g||0),f:+(n.fat_100g||0)};if(nutOdd(r))r.sc-=3;return r;}).filter(Boolean).sort((a,b)=>b.sc-a.sc)[0];
    offCache[key]=best&&best.sc>0?best:null;}catch(e){console.warn(e);if(tries>1){await new Promise(r=>setTimeout(r,1500));return offLookup(term,tries-1);}return null;}return offCache[key];}
// Menge in g/ml (bzw. Stück bei Stück-Zutaten der App) umrechnen
function rowBase(x){const a=+x.amt||0,m=x.m;if(!m||!a)return null;let base=m.base||'g';
  if(m.type==='ing'&&base==='Stk'){const pg=pieceG(x.name,m.id);const v=x.unit==='Stk'?a:x.unit==='EL'?a*15/pg:x.unit==='TL'?a*5/pg:a/pg;return{amt:v,unit:'Stk'};}
  const g=x.unit==='Stk'?a*(m.pg||pieceG(x.name,m.id)):x.unit==='EL'?a*15:x.unit==='TL'?a*5:a;return{amt:g,unit:base==='ml'?'ml':'g'};}
function rowNutr(x){const b=rowBase(x),m=x.m;if(!b||!m||!['ing','own','db','off','manual'].includes(m.type))return null;const f=b.unit==='Stk'?b.amt:b.amt/100;return{k:m.k*f,p:m.p*f,c:m.c*f,f:m.f*f};}

const OCR_SRC='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let ocrLib=null;
function loadOCR(){if(ocrLib)return ocrLib;ocrLib=new Promise((res,rej)=>{const s=document.createElement('script');s.src=OCR_SRC;s.onload=()=>res(window.Tesseract);s.onerror=()=>{ocrLib=null;rej(new Error('ocr'));};document.head.appendChild(s);});return ocrLib;}
async function ocrImages(files,onStatus){
  const T=await loadOCR();const worker=await T.createWorker('deu',1,{logger:m=>{if(m.status==='recognizing text')onStatus(Math.round(m.progress*100));}});
  let out=[];try{for(let i=0;i<files.length;i++){onStatus(0,i+1,files.length);const {data}=await worker.recognize(files[i]);out.push(data.text);}}finally{worker.terminate();}
  return out.join('\n');
}

const PIECE_G={tomaten:80,karotten:80,kartoffeln:120,suesskartoffel:300,zucchini:250,aubergine:300,gurke:400,brokkoli:400,blumenkohl:800,pilze:20,apfel:150,banane:120};

const TL_OK=['sojasauce','honig','olivenoel','sesamoel','tomatenmark','harissa','currypaste','miso','gochujang','erdnussmus','tahin','pesto'];
const NUM='(\\d+(?:[.,]\\d+)?(?:\\s*-\\s*\\d+(?:[.,]\\d+)?)?|\\d+\\s*\\/\\s*\\d+|½|¼|¾|⅓|eine?n?|zwei|drei|vier|halbe?)';
const UNIT='(stiele?|zweige?|stängel|blätter|blatt|kg|g|gr|gramm|ml|l|liter|el|tl|esslöffel|teelöffel|stk|stück|dosen?|bund|pck|päckchen|packung(?:en)?|zehen?|becher|tassen?|cups?|handvoll|scheiben?|prisen?)\\.?';
const ING_RE=new RegExp('^'+NUM+'\\s*(?:'+UNIT+')?\\s+(.+)$','i');
function numOf(s){s=s.toLowerCase().replace(',','.');if(s==='½'||/^halbe?$/.test(s))return .5;if(s==='¼')return .25;if(s==='¾')return .75;if(s==='⅓')return 1/3;if(/^eine?n?$/.test(s))return 1;const w={zwei:2,drei:3,vier:4}[s];if(w)return w;
  if(s.includes('/')){const [a,b]=s.split('/');return +a/+b;}if(s.includes('-')){const [a,b]=s.split('-');return(+a + +b)/2;}return +s;}
function matchIng(text){const t=' '+text.toLowerCase()+' ';for(const [k,id] of SYN_LIST)if(t.includes(k))return id;return null;}
function toUnit(id,amt,unit){
  const u=(unit||'').toLowerCase().replace(/\.$/,''),target=id?ING[id].u:null;
  let base=null,val=amt;
  if(/^(kg)$/.test(u)){base='g';val=amt*1000;}else if(/^(g|gr|gramm)$/.test(u))base='g';
  else if(/^(l|liter)$/.test(u)){base='ml';val=amt*1000;}else if(u==='ml')base='ml';
  else if(/^(el|esslöffel)$/.test(u)){base=target==='ml'?'ml':'g';val=amt*15;}else if(/^(tl|teelöffel)$/.test(u)){base=target==='ml'?'ml':'g';val=amt*5;}
  else if(/^(tasse|tassen|cup|cups)$/.test(u)){base=target==='ml'?'ml':'g';val=amt*(target==='ml'?240:150);}
  else if(/^becher$/.test(u)){base='g';val=amt*200;}
  else if(/^dosen?$/.test(u)){base=target==='Stk'?'Stk':'g';val=id&&target!=='Stk'?amt*ING[id].pack:amt*400;}
  else if(/^(packung|packungen|pck|päckchen)$/.test(u)){base=target==='Stk'?'Stk':target||'g';val=id&&target!=='Stk'?amt*ING[id].pack:amt*(target==='Stk'?1:250);}
  else{base='Stk';}
  if(!target)return{amt:Math.round(val),unit:base};
  if(base===target||(base==='g'&&target==='ml')||(base==='ml'&&target==='g'))return{amt:Math.round(val*10)/10,unit:target};
  if(base==='Stk'&&target!=='Stk')return{amt:Math.round(val*(PIECE_G[id]||100)),unit:target};
  if(base!=='Stk'&&target==='Stk')return{amt:Math.max(.5,Math.round(val/150*2)/2),unit:'Stk'};
  return{amt:val,unit:target};
}
function parseRecipeText(raw){
  const lines=raw.replace(/\r/g,'').split('\n').filter(l=>!/^\s*[#@]/.test(l)).map(l=>l.replace(/\(n\)/g,'').replace(/\([^)]*\)/g,' ').replace(/\b(gestr\.?|gestrichene?|gehäufte?|knapp|ca\.?|etwa|etwas|evtl\.?)\s+/gi,'').replace(/\s+/g,' ').trim().replace(/^[^\p{L}\p{N}½¼¾⅓]+/u,'').trim()).filter(Boolean);
  const rows=[],steps=[];let name='',serv=null,min=null,inSteps=false;
  for(const l of lines){
    const sv=l.match(/(\d+)\s*(portionen|personen|pers\.|servings)/i);if(sv&&!serv)serv=+sv[1];
    const mn=l.match(/(\d+)\s*(min\.?|minuten)\b/i);if(mn&&!min&&!inSteps)min=+mn[1];
    if(/^(zubereitung|anleitung|so geht'?s|so wird'?s gemacht|schritte|instructions)/i.test(l)){inSteps=true;continue;}
    if(/^(zutaten|ingredients|du brauchst|für \d)/i.test(l)){inSteps=false;continue;}
    const st=l.match(/^(\d+)[.)]\s+(.{12,})$/);
    if(st&&!ING_RE.test(l.replace(/^\d+[.)]\s+/,''))){steps.push(st[2]);continue;}
    const m=!inSteps&&l.match(ING_RE);
    if(m){const what=m[3].replace(/^(von|vom|der|die|das)\s+/i,'').replace(/[,(].*$/,'').trim();
      if(!what||SKIP.test(what))continue;
      if(/^(stiele?|zweige?|stängel|blätter|blatt)$/i.test(m[2]||''))continue;
      if(SKIP.test(what.replace(/^(frische?n?|glatte?n?|getrocknete?n?|gemahlene?n?|geräuchert\w*|gehackte?n?)\s+/i,'')))continue;
      let id=matchIng(what);if(id==='tomaten'&&/^dosen?$/i.test(m[2]||''))id='tomaten_dose';if(/^(tl|teelöffel|prisen?|msp)$/i.test(m[2]||'')&&!TL_OK.includes(id))continue;const cv=toUnit(id,numOf(m[1]),m[2]);
      if(!(cv.amt>0))continue;
      if(id){const ex=rows.find(r=>r.id===id);if(ex){ex.amt=+(+ex.amt+cv.amt).toFixed(1);continue;}rows.push({id,amt:cv.amt});}
      else rows.push({id:'_other',name:what.charAt(0).toUpperCase()+what.slice(1),unit:cv.unit,amt:cv.amt,tag:''});
      continue;}
    if(inSteps&&l.length>12){steps.push(l);continue;}
    if(!name&&l.length>=4&&l.length<=70&&/[a-zäöü]{3}/i.test(l)&&!/^[#@]|http|www\.|follow|folg|like|link in bio/i.test(l))name=l.replace(/[#@].*$/,'').replace(/[^\p{L}\p{N}\s&,'’-]/gu,'').trim();
  }
  return{name,serv,min,rows,steps};
}
function applyParsed(p){
  readNew();
  if(p.name&&!nr.n.trim())nr.n=p.name;
  if(p.serv)nr.serv=p.serv;if(p.min&&!nr.min)nr.min=p.min;
  const kept=nr.rows.filter(x=>x.name.trim()&&x.amt);
  const conv=p.rows.map(x=>{if(x.id==='_other'){const r={name:x.name,amt:String(x.amt),unit:x.unit||'g',m:null};resolveRow(r);return r;}
    const i=ING[x.id];return{name:i.n.replace(/\s*\(.*\)/,''),amt:String(+(+x.amt).toFixed(1)),unit:i.u,m:{type:'ing',id:x.id,name:i.n,k:i.k,p:i.p,c:i.c,f:i.f,base:i.u}};});
  nr.rows=kept.concat(conv);if(!nr.rows.length)nr.rows=[blankRow()];
  if(p.steps.length&&(!nr.steps.trim()||nr.src))nr.steps=p.steps.join('\n');
  drawNew();
  const el=document.getElementById('impMsg');
  if(el)el.innerHTML=p.rows.length?`<span style="color:var(--basil)">${p.rows.length} Zutaten erkannt${p.steps.length?` und ${p.steps.length} Schritte`:''}.</span> Bitte kurz prüfen, besonders die Mengen.`:'<span class="warn">Keine Zutaten mit Mengen gefunden. Versuch einen schärferen Screenshot oder füg den Text ein.</span>';
}

// Rezept aus einem Link: Seite über r.jina.ai holen, strukturierte Rezeptdaten (schema.org) auslesen
function isoMin(t){const m=String(t||'').match(/P(?:\d+D)?T?(?:(\d+)H)?(?:(\d+)M)?/i);return m?((+m[1]||0)*60+(+m[2]||0))||null:null;}
function findRecipe(o){if(!o||typeof o!=='object')return null;if(Array.isArray(o)){for(const x of o){const r=findRecipe(x);if(r)return r;}return null;}
  const t=o['@type'];if((Array.isArray(t)?t:[t]).includes('Recipe')&&o.recipeIngredient)return o;
  for(const k of ['@graph','mainEntity','itemListElement']){if(o[k]){const r=findRecipe(o[k]);if(r)return r;}}return null;}
function stepsOf(ins){const out=[];const walk=x=>{if(!x)return;if(typeof x==='string'){x.split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(s=>out.push(s));return;}
  if(Array.isArray(x)){x.forEach(walk);return;}if(x.itemListElement){walk(x.itemListElement);return;}if(x.text)out.push(String(x.text).replace(/<[^>]+>/g,'').trim());};walk(ins);return out.filter(Boolean);}
async function importUrl(){
  readNew();const url=(nr.url||'').trim();const msg=t=>{nr.urlMsg=t;const e=document.getElementById('urlMsg');if(e)e.innerHTML=t;};
  if(!/^https?:\/\//i.test(url)){msg('<span class="warn">Bitte einen vollständigen Link einfügen (beginnt mit https://).</span>');return;}
  msg('Rezept wird geholt …');
  try{
    const res=await fetch('https://r.jina.ai/'+url,{headers:{'X-Return-Format':'html'}});if(!res.ok)throw new Error('http '+res.status);
    const html=await res.text();const doc=new DOMParser().parseFromString(html,'text/html');let rec=null;
    doc.querySelectorAll('script[type="application/ld+json"]').forEach(sc=>{if(rec)return;try{rec=findRecipe(JSON.parse(sc.textContent));}catch(e){}});
    let p;
    if(rec){p=parseRecipeText('Zutaten:\n'+(rec.recipeIngredient||[]).join('\n'));p.steps=stepsOf(rec.recipeInstructions);p.name=String(rec.name||'').replace(/\s+Rezept$/i,'').trim();
      const y=String(Array.isArray(rec.recipeYield)?rec.recipeYield[0]:rec.recipeYield||'').match(/\d+/);p.serv=y?+y[0]:null;p.min=isoMin(rec.totalTime)||isoMin(rec.cookTime)||null;
      let img=rec.image;if(Array.isArray(img))img=img[0];if(img&&typeof img==='object')img=img.url;nr.img=typeof img==='string'?img:'';}
    else{const txt=await (await fetch('https://r.jina.ai/'+url)).text();p=parseRecipeText(txt);nr.img='';}
    nr.src=url;nr.urlMsg='';
    if(p.name)nr.n=p.name;applyParsed(p);
    msg(p.rows.length?`<span style="color:var(--basil)">Übernommen: ${p.rows.length} Zutaten${p.steps.length?`, ${p.steps.length} Schritte`:''}${nr.img?', Foto':''}.</span> Bitte Mengen kurz prüfen.`:'<span class="warn">Auf der Seite wurde kein Rezept gefunden. Kopier den Text und nutz „Oder Text einfügen“.</span>');
  }catch(e){console.warn(e);msg('<span class="warn">Die Seite konnte nicht geladen werden. Kopier den Rezepttext und nutz „Oder Text einfügen“.</span>');}
}
// Foto verkleinern und als Bild-Daten speichern (kein extra Speicherdienst nötig)
function shrinkPhoto(file,max=1000){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const f=Math.min(1,max/Math.max(w,h));w=Math.round(w*f);h=Math.round(h*f);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    let q=0.75,d=c.toDataURL('image/jpeg',q);while(d.length>330000&&q>0.35){q-=0.1;d=c.toDataURL('image/jpeg',q);}
    if(d.length>330000)return shrinkPhoto(file,Math.round(max*0.7)).then(res,rej);res(d);};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};img.src=url;});}
function saveNew(){
  readNew();const err=t=>{document.getElementById('nrErr').textContent=t;};
  const name=nr.n.trim();if(!name)return err('Bitte einen Namen eintragen.');
  const rows=nr.rows.filter(x=>x.name.trim());
  if(!rows.length)return err('Bitte mindestens eine Zutat eintragen.');
  if(rows.some(x=>!(+x.amt>0)))return err('Bitte bei allen Zutaten eine Menge eintragen.');
  if(rows.some(x=>x.m&&x.m.type==='pending'))return err('Einen Moment, die Nährwerte werden noch gesucht …');
  const huge=rows.filter(x=>{const b=rowBase(x);return b&&((b.unit==='Stk'&&b.amt>25)||(b.unit!=='Stk'&&b.amt>2500));}).map(x=>x.name.trim());
  if(huge.length&&!confirm(`Sehr große Menge bei ${huge.join(', ')} – stimmt die Einheit (Gramm/Stück)? Trotzdem speichern?`))return;
  const noNut=rows.filter(x=>!x.m||x.m.type==='none').map(x=>x.name.trim());
  if(noNut.length&&!confirm(`Für ${noNut.join(', ')} fehlen Nährwerte – die Kalorien werden dann zu niedrig berechnet. Trotzdem speichern?`))return;
  const ings=rows.map(x=>{const m=x.m||{},b=rowBase(x)||{amt:+x.amt,unit:x.unit==='ml'?'ml':'g'};
    if(m.type==='ing')return{id:m.id,name:ING[m.id].n,amt:+b.amt.toFixed(2),unit:ING[m.id].u};
    return{id:null,name:x.name.trim(),amt:+b.amt.toFixed(1),unit:b.unit==='ml'?'ml':'g',k:m.k||0,p:m.p||0,c:m.c||0,f:m.f||0,tags:m.tags||[]};});
  // neue Zutaten merken (für Vorschläge und automatische Nährwerte, für euch beide)
  rows.forEach(x=>{const m=x.m;if(!m||!['off','manual'].includes(m.type))return;const l=x.name.trim().toLowerCase();
    const e={n:x.name.trim(),k:+m.k||0,p:+m.p||0,c:+m.c||0,f:+m.f||0,u:m.base==='ml'?'ml':'g',pg:+m.pg||0,tags:m.tags||[]};OWN_ING[l]=e;
    if(db)write('ing'+l,()=>db.doc('ingredients/'+slug(l).replace(/[^a-z0-9äöüß_-]/g,'')||uid()).set(clone(e)));});
  lsSet('fk-own-ing',OWN_ING);
  const doc={n:name,serv:+nr.serv||4,min:+nr.min||30,meals:nr.meals.length?nr.meals:['A'],flags:nr.flags,ings,src:nr.src||'',img:nr.img||'',
    steps:nr.steps.split('\n').map(s=>s.trim()).filter(Boolean),created:Date.now(),by:myId};
  const rid='own_'+uid();CUSTOM[rid]=doc;persistLocal();rebuildRecipes();
  if(db)write('rec'+rid,()=>db.doc('recipes/'+rid).set(clone(doc)));
  closeSheet();toast('Rezept gespeichert');ui.tab='rezepte';render();openRecipe(rid);
}

// Einmal pro Woche eine Kopie der gemeinsamen Daten in der Cloud ablegen (backups/{datum})
async function autoBackup(){
  if(!db)return;try{
    const m=await db.doc('household/meta').get(),last=m.exists?m.data().lastBackup||'':'';
    if(last&&last>addDays(dkey(),-7))return;
    const weeks={};Object.keys(WEEKS).forEach(w=>{if(w>=addDays(THIS_WEEK,-42))weeks[w]=WEEKS[w];});
    await db.doc('backups/'+dkey()).set(clone({t:Date.now(),by:myId,hh:HH,weeks,votes:VOTES,recipes:CUSTOM}));
    await db.doc('household/meta').update({lastBackup:dkey()});
  }catch(e){console.warn('backup',e);}
}
// Alles (gemeinsam + privat, inkl. Tracker der letzten 90 Tage) als Datei herunterladen
async function downloadBackup(){
  toast('Backup wird erstellt …');
  const logs={};for(let i=0;i<90;i++){const k=addDays(dkey(),-i);const l=await loadLog(k);if(l&&l.length)logs[k]=l;}
  const data={app:'Mmmh',version:1,created:new Date().toISOString(),code:SETUP&&SETUP.code,user:SETUP&&SETUP.name,me:ME,household:HH,weeks:WEEKS,votes:VOTES,recipes:CUSTOM,tracker:logs};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const name=`mmmh-backup-${dkey()}.json`;
  try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Mmmh Backup'});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

// Gericht aus dem Plan gegessen: in den eigenen Tracker, Tag für beide als gekocht markieren
const fmtP=n=>String(n).replace('.',',');
const num=v=>{const x=parseFloat(String(v??'').trim().replace(/\s/g,'').replace(',','.'));return isNaN(x)?NaN:x;};
const numStr=v=>String(v??'').trim().replace(',','.');
async function eatPlanned(w,d,portions=1,slotIn){
  const x=weekDoc(w).days[d]||{},r=x.rid&&R(x.rid);if(!r)return;
  const today=dkey(),k=d<today?d:today,slot=slotIn||(k===today&&slotNow()!=='Snack'?slotNow():'Abendessen');
  const pr=perFor(r);await loadLog(k);LOGS[k].push({id:uid(),t:Date.now(),slot,name:r.n,portions,k:pr.k*portions,p:pr.p*portions,c:pr.c*portions,f:pr.f*portions});saveLog(k);
  patchWeek(w,{days:{[d]:{cooked:x.cooked||myId,ate:{[myId]:true}}}});
}
function plannedDay(rid){for(const w of [THIS_WEEK,NEXT_WEEK]){const W=WEEKS[w];if(!W||!W.days)continue;const d=Object.keys(W.days).sort().find(d=>W.days[d]&&W.days[d].rid===rid&&!W.days[d].skip&&!(W.days[d].ate&&W.days[d].ate[myId])&&d<=dkey());if(d)return{w,d};}return null;}
// Fenster "In meinen Tracker": Portionen und Mahlzeit wählen
function trackSheet(w,d){
  const x=weekDoc(w).days[d]||{},r=x.rid&&R(x.rid);if(!r)return;
  const st={p:1,slot:d===dkey()&&slotNow()!=='Snack'?slotNow():'Abendessen'},pr=perFor(r);
  const draw=()=>{const sc=document.querySelector('.sheet');const html=`<div class="sheet-head"><h2>In meinen Tracker</h2><button class="x-btn" data-close aria-label="Schließen">×</button></div>
   <p style="font-weight:600;margin-bottom:4px">${esc(r.n)}</p><p class="small muted">${swapText(r)?swapText(r)+' · ':''}Nur für dich${swapText(r)?', mit deinem Ersatz gerechnet':''}. Die anderen tragen ihre Portion selbst ein.</p>
   <div class="panel"><div class="spread"><span>Portionen</span><span class="stepper"><button data-t="-">−</button><span>${fmtP(st.p)}</span><button data-t="+">+</button></span></div>
    <div class="facts4" style="margin-bottom:0"><div><b>${r0(pr.k*st.p)}</b><small>kcal</small></div><div><b>${r0(pr.p*st.p)}</b><small>g Protein</small></div><div><b>${r0(pr.c*st.p)}</b><small>g Kohlenh.</small></div><div><b>${r0(pr.f*st.p)}</b><small>g Fett</small></div></div>
    <div class="spread" style="margin-top:12px"><span>Mahlzeit</span><select id="tsSlot" style="width:auto">${SLOTS.map(s=>`<option ${s===st.slot?'selected':''}>${s}</option>`).join('')}</select></div></div>
   <button class="btn basil" data-t="ok" style="width:100%">Eintragen</button>`;
   if(sc)sc.innerHTML=html;else openSheet(html);
   const s2=document.querySelector('.sheet');s2.onchange=e=>{if(e.target.id==='tsSlot')st.slot=e.target.value;};
   s2.onclick=async e=>{const b=e.target.closest('[data-t]');if(!b)return;const t=b.dataset.t;
     if(t==='-'&&st.p>0.5){st.p-=0.5;draw();}if(t==='+'&&st.p<6){st.p+=0.5;draw();}
     if(t==='ok'){closeSheet();await eatPlanned(w,d,st.p,st.slot);toast(`${fmtP(st.p)} Portion${st.p===1?'':'en'} eingetragen, als gekocht markiert`);}};};
  draw();
}
function addPref(fid){const inp=document.getElementById(fid);if(!inp)return;const p=resolvePref(inp.value,fid==='addAvoid');if(!p){inp.focus();return;}
  if(fid==='addAvoid'||fid==='addLike'||fid==='addMeh'){const key=fid==='addAvoid'?'avoid':fid==='addLike'?'likes':'meh';ME[key]=ME[key]||[];if(!ME[key].includes(p))ME[key].push(p);saveMe();}
  else{const v=myVotes();v.ing=v.ing||{};const cur=wkIng(myId,ui.week),k=fid==='wkLike'?'like':'dis',o=k==='like'?'dis':'like',val=p.startsWith('ing:')?p.slice(4):p;
    cur[o]=cur[o].filter(x=>x!==val);if(!cur[k].includes(val))cur[k].push(val);v.ing[ui.week]=cur;saveVotes();}
  inp.value='';inp.blur();render(true);toast(`${labelPref(p)} hinzugefügt`);}
function vote(rid,s,card){const w=ui.week;const v=myVotes();v.w[w]=v.w[w]||{};if(!card&&v.w[w][rid]===s)delete v.w[w][rid];else v.w[w][rid]=s;
  ui.undo=card?{w,r:rid}:null;if(s>=2&&!suggIds(w).includes(rid))patchWeek(w,{sugg:suggIds(w).concat(rid)});saveVotes();render();}

    db.collection('members').onSnapshot(s=>{s.docs.forEach(x=>{if(x.exists&&x.data().name)names[x.id]=x.data().name;});render();},e=>console.warn(e));
    db.doc('household/main').onSnapshot(s=>{if(s.exists)HH=Object.assign({dinners:7,serv:4,pause:2},clone(s.data()));else if(!s.cache)saveHH();render();},e=>console.warn(e));
    db.collection('ingredients').onSnapshot(s=>{s.docs.forEach(x=>{if(x.exists){const d=x.data();if(d&&d.n)OWN_ING[d.n.toLowerCase()]=d;}});lsSet('fk-own-ing',OWN_ING);},e=>console.warn(e));
    db.collection('recipes').onSnapshot(s=>{if(s.cache&&!s.docs.length)return;const c={};s.docs.forEach(x=>{if(x.exists)c[x.id]=clone(x.data());});CUSTOM=c;rebuildRecipes();persistLocal();render();},e=>console.warn(e));
    db.collection('votes').onSnapshot(s=>{if(s.cache&&!s.docs.length)return;const mine=VOTES[myId];const v={};s.docs.forEach(x=>{if(x.exists)v[x.id]=clone(x.data());});if(mine&&(vT||!v[myId])){v[myId]=mine;if(!vT)saveVotes();}VOTES=v;persistLocal();render();},e=>console.warn(e));
    let fin=false;
    [THIS_WEEK,NEXT_WEEK].forEach(w=>db.doc('weeks/'+w).onSnapshot(s=>{if(s.exists)WEEKS[w]=deepMerge(emptyWeek(),clone(s.data()));else if(s.cache)return;else delete WEEKS[w];if(!s.cache)weekSeen[w]=true;
      persistLocal();if(w===NEXT_WEEK&&!fin){fin=true;setTimeout(autoFinalize,1500);}render();},e=>console.warn(e)));
    [7,14,21,28,35,42].forEach(n=>{const w=addDays(THIS_WEEK,-n);db.doc('weeks/'+w).get().then(s=>{if(s.exists){WEEKS[w]=deepMerge(emptyWeek(),clone(s.data()));render();}}).catch(()=>{});});
    syncVeto();
    setTimeout(autoBackup,8000);
    cloudTried=true;
  }catch(e){cloudTried=true;console.warn(e);setSync('err');toast('Keine Verbindung. Die App speichert erstmal nur auf diesem Gerät.');autoFinalize();}
  render();
})();
</script>
</body>
</html>
